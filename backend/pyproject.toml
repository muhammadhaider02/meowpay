[project]
name = "meowpay"
version = "0.1.0"
description = "A digital wallet for cats. Humans top it up, cats send each other treats."
license = { text = "MIT" }
requires-python = ">=3.13,<3.15"
authors = [{ name = "Haider Akbar" }]
dependencies = [
    "fastapi>=0.115",
    # imported directly by api/app.py's serve(). it resolves transitively
    # today, but declare it so a dependency bump cannot silently drop the
    # server's own ASGI runner.
    "uvicorn>=0.34",
    "sqlalchemy>=2.0.36",
    # binary wheels exist for cp313 on win_amd64, manylinux x86_64 and macos
    # arm64, so a clean clone needs no compiler on any platform a reviewer is
    # likely to use.
    "psycopg[binary]>=3.2",
    "alembic>=1.16",
    "python-dotenv>=1.0",
    # Supabase access token verification. PyJWT rather than python-jose, which
    # Supabase's own Python sample uses: python-jose last released in 2021, is
    # unmaintained, has had algorithm-confusion CVEs and depends on `ecdsa`,
    # which carries a timing side-channel advisory. Not in a money service.
    "pyjwt[crypto]>=2.10",
    # The GoTrue admin API, used by meowpay-seed. A runtime dependency because
    # meowpay-seed is a runtime entry point, not a test helper.
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    # Pinned exactly, not floated, because .pre-commit-config.yaml names a
    # ruff version too and a formatter that disagrees with itself rewrites
    # files the other half just approved.
    "ruff==0.16.7",
    "mypy>=1.15",
    "pre-commit>=4.0",
]

[project.scripts]
meowpay-api = "meowpay.api.app:serve"
meowpay-seed = "meowpay.seed:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meowpay"]

[tool.ruff]
target-version = "py313"
line-length = 99
src = ["src"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "LOG",  # flake8-logging
    "T20",  # flake8-print
]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["meowpay"]

[tool.ruff.lint.per-file-ignores]
# alembic's generated templates are not ours to restyle
"migrations/*" = ["I", "N", "UP"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
packages = ["meowpay"]
mypy_path = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"
markers = [
    "db: test needs a running, migrated postgres",
    "concurrency: test drives real parallel transactions",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = ["src"]
